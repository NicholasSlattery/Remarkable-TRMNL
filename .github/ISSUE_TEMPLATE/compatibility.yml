name: Firmware compatibility request
description: Request validation of a new reMarkable firmware build.
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Exact model
      placeholder: "reMarkable Paper Pro / Ferrari"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Exact firmware build
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Available test evidence
      description: Do not post credentials or private documents/captures.
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand unsupported firmware must not be force-installed.
          required: true
