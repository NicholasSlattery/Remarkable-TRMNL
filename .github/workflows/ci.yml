name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qt6-base-dev qt6-declarative-dev-tools
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/qt6/libexec" >> "$GITHUB_PATH"
      - name: Formatting
        run: test -z "$(gofmt -l backend installer)"
      - name: Unit tests and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Shell and Python checks
        run: |
          shellcheck ./*.sh scripts/*.sh
          python3 -m compileall -q scripts tests
      - name: QML lint and resources
        run: |
          qmllint -I tests/qml-stubs app/ui/TRMNL.qml
          rcc --binary -o /tmp/resources.rcc app/application.qrc
          test -s /tmp/resources.rcc
      - name: ARM64 build
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -X main.version=$(cat VERSION)" -o /tmp/trmnl-remarkable ./backend/cmd/trmnl-remarkable
      - name: AppLoad protocol integration
        run: |
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w -X main.version=integration' -o /tmp/trmnl-backend ./backend/cmd/trmnl-remarkable
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' -o /tmp/trmnl-mock ./backend/cmd/trmnl-mock
          python3 tests/appload_harness.py /tmp/trmnl-backend /tmp/trmnl-mock
      - name: Dependency vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
